<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="172" viewBox="0 0 480 172" role="img" aria-label="Hearthmon — Coder-mon, quietly building">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1a1530"/>
      <stop offset="50%"  stop-color="#201c38"/>
      <stop offset="100%" stop-color="#251e40"/>
    </linearGradient>

    <radialGradient id="sprGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%"   stop-color="#f0b66a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f0b66a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="aur1" cx="20%" cy="40%" r="45%">
      <stop offset="0%"   stop-color="#7b5ea7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7b5ea7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aur2" cx="80%" cy="60%" r="40%">
      <stop offset="0%"   stop-color="#5468c4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#5468c4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="borderShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#b07840" stop-opacity="0">
        <animate attributeName="offset"       values="0%;40%;80%;0%"    dur="4s" repeatCount="indefinite"/>
        <animate attributeName="stop-opacity" values="0;0.7;0;0"        dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="40%"  stop-color="#f0b66a"    stop-opacity="0">
        <animate attributeName="offset"       values="40%;80%;120%;40%" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="stop-opacity" values="0;0.9;0;0"        dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#b07840" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0;0.5;0"        dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="nameShimmer" x1="-60%" y1="0%" x2="60%" y2="0%" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#f6f1ff"/>
      <stop offset="45%"  stop-color="#f6f1ff"/>
      <stop offset="50%"  stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#f6f1ff"/>
      <stop offset="100%" stop-color="#f6f1ff"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-300 0;600 0;600 0;-300 0" keyTimes="0;0.35;0.65;1"
        dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="chipGlint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="50%"  stop-color="white" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="cardClip">
      <rect width="480" height="172" rx="16"/>
    </clipPath>

    <style>
      /*
       * ── POKEMON MOVEMENT ────────────────────────────────────────────────────
       * Single element, transform-box:fill-box, transform-origin:50% 100%
       * → all transforms pivot from the sprite's feet (bottom-centre of its bbox).
       *
       * 18-second story loop:
       *   0–8%   : idle gentle bob (breathe)
       *   10–23% : WIND-UP → big hop (22px) → squash landing → bounce-settle
       *   28–42% : body SWAY left/right
       *   46–50% : rest breathing
       *   51–57% : quick FIDGET hop
       *   60–70% : excited WIGGLE (fast left/right rotations)
       *   74–84% : rest breathing
       *   85–93% : second BIG HOP
       *   93–100%: calm rest, loop
       *
       * Shadow mirrors every hop/squash so it shrinks airborne & fans out on landing.
       */

      .mon {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        image-rendering: pixelated;
        animation: monAll 18s cubic-bezier(0.45,0,0.55,1) infinite;
      }

      .shadow {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: shadowAll 18s cubic-bezier(0.45,0,0.55,1) infinite;
      }

      .sprGlow {
        transform-box: fill-box;
        transform-origin: center;
        animation: glowPulse 4s ease-in-out infinite;
      }

      .pt    { opacity:0; animation: rise 4.4s ease-in-out infinite; }
      .bub   { animation: bubFloat 5s ease-in-out infinite; }
      .aur   { animation: aurDrift  12s ease-in-out infinite alternate; }
      .aur2  { animation: aurDrift2 14s ease-in-out infinite alternate; }
      .chip      { animation: chipPulse 6s ease-in-out infinite; }
      .chipshine { animation: chipSweep 6s ease-in-out infinite; }
      .label  { animation: labelTwinkle 8s ease-in-out infinite; }
      .footer { animation: footerPulse  7s ease-in-out infinite; }

      /* ── FULL MOVEMENT KEYFRAME ── */
      @keyframes monAll {
        /* idle bob */
        0%   { transform: translateY(0)     scaleX(1)    scaleY(1)    rotate(0deg);  }
        3%   { transform: translateY(-3px)  scaleX(0.97) scaleY(1.04) rotate(0deg);  }
        6%   { transform: translateY(0)     scaleX(1.01) scaleY(0.99) rotate(0deg);  }
        8%   { transform: translateY(-2px)  scaleX(0.98) scaleY(1.02) rotate(0deg);  }
        9%   { transform: translateY(0)     scaleX(1)    scaleY(1)    rotate(0deg);  }

        /* wind-up crouch */
        10%  { transform: translateY(4px)   scaleX(1.08) scaleY(0.90) rotate(0deg);  }

        /* peak of BIG HOP — stretched tall, slight lean */
        13%  { transform: translateY(-22px) scaleX(0.86) scaleY(1.18) rotate(-3deg); }
        15%  { transform: translateY(-10px) scaleX(0.91) scaleY(1.11) rotate(-1deg); }

        /* LAND — wide squash */
        16%  { transform: translateY(0)     scaleX(1.28) scaleY(0.76) rotate(0deg);  }

        /* bounce 1 */
        18%  { transform: translateY(-10px) scaleX(0.93) scaleY(1.09) rotate(1deg);  }

        /* second land (softer) */
        20%  { transform: translateY(0)     scaleX(1.12) scaleY(0.91) rotate(0deg);  }

        /* micro bounce */
        21%  { transform: translateY(-4px)  scaleX(0.98) scaleY(1.03) rotate(0deg);  }

        /* fully settled */
        23%  { transform: translateY(0)     scaleX(1)    scaleY(1)    rotate(0deg);  }

        /* BODY SWAY left */
        28%  { transform: translateY(0)     scaleX(1)    scaleY(1)    rotate(-6deg); }

        /* BODY SWAY right */
        34%  { transform: translateY(0)     scaleX(1)    scaleY(1)    rotate(6deg);  }

        /* slight tilt back */
        38%  { transform: translateY(0)     scaleX(1)    scaleY(1)    rotate(-2deg); }

        /* straight */
        42%  { transform: translateY(0)     scaleX(1)    scaleY(1)    rotate(0deg);  }

        /* rest breathe */
        46%  { transform: translateY(-3px)  scaleX(0.97) scaleY(1.04) rotate(0deg);  }
        50%  { transform: translateY(0)     scaleX(1)    scaleY(1)    rotate(0deg);  }

        /* FIDGET hop wind-up */
        51%  { transform: translateY(2px)   scaleX(1.05) scaleY(0.94) rotate(0deg);  }

        /* fidget peak */
        52%  { transform: translateY(-12px) scaleX(0.92) scaleY(1.12) rotate(2deg);  }

        /* fidget land */
        53%  { transform: translateY(0)     scaleX(1.18) scaleY(0.85) rotate(0deg);  }

        /* fidget settle */
        55%  { transform: translateY(-2px)  scaleX(0.99) scaleY(1.02) rotate(0deg);  }
        57%  { transform: translateY(0)     scaleX(1)    scaleY(1)    rotate(0deg);  }

        /* EXCITED WIGGLE — rapid left/right tail-wag energy */
        60%  { transform: translateY(-1px)  scaleX(1)    scaleY(1)    rotate(-6deg); }
        62%  { transform: translateY(-1px)  scaleX(1)    scaleY(1)    rotate(6deg);  }
        64%  { transform: translateY(-1px)  scaleX(1)    scaleY(1)    rotate(-5deg); }
        66%  { transform: translateY(-1px)  scaleX(1)    scaleY(1)    rotate(5deg);  }
        68%  { transform: translateY(-1px)  scaleX(1)    scaleY(1)    rotate(-2deg); }
        70%  { transform: translateY(0)     scaleX(1)    scaleY(1)    rotate(0deg);  }

        /* rest breathe */
        74%  { transform: translateY(-3px)  scaleX(0.97) scaleY(1.04) rotate(0deg);  }
        78%  { transform: translateY(0)     scaleX(1)    scaleY(1)    rotate(0deg);  }
        84%  { transform: translateY(0)     scaleX(1)    scaleY(1)    rotate(0deg);  }

        /* SECOND BIG HOP */
        85%  { transform: translateY(4px)   scaleX(1.08) scaleY(0.90) rotate(0deg);  }
        87%  { transform: translateY(-22px) scaleX(0.86) scaleY(1.18) rotate(3deg);  }
        88%  { transform: translateY(-9px)  scaleX(0.91) scaleY(1.10) rotate(1deg);  }
        89%  { transform: translateY(0)     scaleX(1.28) scaleY(0.76) rotate(0deg);  }
        90%  { transform: translateY(-8px)  scaleX(0.94) scaleY(1.07) rotate(-1deg); }
        91%  { transform: translateY(0)     scaleX(1.10) scaleY(0.93) rotate(0deg);  }
        93%  { transform: translateY(0)     scaleX(1)    scaleY(1)    rotate(0deg);  }

        /* calm rest → loop */
        100% { transform: translateY(0)     scaleX(1)    scaleY(1)    rotate(0deg);  }
      }

      /* Shadow mirrors the big hops — tiny + faint airborne, wide + dark on landing */
      @keyframes shadowAll {
        0%   { transform: scaleX(1)    scaleY(1);     opacity: 0.32; }
        9%   { transform: scaleX(1)    scaleY(1);     opacity: 0.32; }
        10%  { transform: scaleX(1.06) scaleY(1.06);  opacity: 0.40; } /* crouch */
        13%  { transform: scaleX(0.52) scaleY(0.38);  opacity: 0.10; } /* hop peak */
        15%  { transform: scaleX(0.68) scaleY(0.52);  opacity: 0.16; } /* coming down */
        16%  { transform: scaleX(1.45) scaleY(1.40);  opacity: 0.58; } /* LAND impact */
        18%  { transform: scaleX(0.78) scaleY(0.62);  opacity: 0.18; } /* bounce */
        20%  { transform: scaleX(1.18) scaleY(1.14);  opacity: 0.44; } /* soft land */
        23%  { transform: scaleX(1)    scaleY(1);     opacity: 0.32; } /* settled */
        51%  { transform: scaleX(1.04) scaleY(1.04);  opacity: 0.38; } /* fidget wind-up */
        52%  { transform: scaleX(0.68) scaleY(0.52);  opacity: 0.14; } /* fidget peak */
        53%  { transform: scaleX(1.22) scaleY(1.18);  opacity: 0.50; } /* fidget land */
        57%  { transform: scaleX(1)    scaleY(1);     opacity: 0.32; } /* settled */
        85%  { transform: scaleX(1.06) scaleY(1.06);  opacity: 0.40; } /* 2nd wind-up */
        87%  { transform: scaleX(0.52) scaleY(0.38);  opacity: 0.10; } /* 2nd hop peak */
        89%  { transform: scaleX(1.45) scaleY(1.40);  opacity: 0.58; } /* 2nd land */
        91%  { transform: scaleX(1.12) scaleY(1.08);  opacity: 0.40; } /* 2nd settle */
        93%  { transform: scaleX(1)    scaleY(1);     opacity: 0.32; }
        100% { transform: scaleX(1)    scaleY(1);     opacity: 0.32; }
      }

      @keyframes glowPulse {
        0%,100% { opacity:0.5;  transform: scale(1);    }
        50%     { opacity:0.85; transform: scale(1.06); }
      }
      @keyframes rise {
        0%   { opacity:0;   transform: translateY(0px)   rotate(0deg);  }
        15%  { opacity:0.9; }
        80%  { opacity:0.3; }
        100% { opacity:0;   transform: translateY(-36px) rotate(25deg); }
      }
      @keyframes bubFloat {
        0%,100% { transform: translateY(0px);  opacity:1;    }
        40%     { transform: translateY(-2px); opacity:1;    }
        70%     { transform: translateY(-1px); opacity:0.92; }
      }
      @keyframes aurDrift  {
        0%   { transform: translate(0px, 0px);   }
        50%  { transform: translate(18px,8px);   }
        100% { transform: translate(4px, 14px);  }
      }
      @keyframes aurDrift2 {
        0%   { transform: translate(0px,  0px);  }
        50%  { transform: translate(-12px,-6px); }
        100% { transform: translate(-4px, 10px); }
      }
      @keyframes chipPulse {
        0%,100% { opacity:1;    }
        50%     { opacity:0.75; }
      }
      @keyframes chipSweep {
        0%,100% { fill-opacity:0;    }
        50%     { fill-opacity:0.55; }
      }
      @keyframes labelTwinkle {
        0%,48%,52%,100% { opacity:1;    }
        50%             { opacity:0.5;  }
        75%             { opacity:0.85; }
      }
      @keyframes footerPulse {
        0%,100% { opacity:0.6; }
        50%     { opacity:0.9; }
      }
    </style>
  </defs>

  <!-- Base card -->
  <rect width="480" height="172" rx="16" fill="url(#bg)"/>

  <!-- Aurora blobs -->
  <g clip-path="url(#cardClip)">
    <ellipse class="aur"  cx="90"  cy="70"  rx="160" ry="100" fill="url(#aur1)"/>
    <ellipse class="aur2" cx="380" cy="110" rx="140" ry="90"  fill="url(#aur2)"/>
  </g>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="479" height="171" rx="16" fill="none" stroke="#786ca0" stroke-opacity="0.3"/>
  <rect x="0.5" y="0.5" width="479" height="171" rx="16" fill="none" stroke="url(#borderShimmer)" stroke-width="1.5"/>

  <!-- Sprite glow -->
  <ellipse class="sprGlow" cx="76" cy="100" rx="52" ry="48" fill="url(#sprGlow)"/>

  <!-- Ground shadow (synced to hop/squash keyframes) -->
  <ellipse class="shadow" cx="76" cy="146" rx="40" ry="7" fill="#000" fill-opacity="0.38"/>

  <!-- Sparkle particles -->
  <text class="pt" x="40" y="120" font-size="10" fill="#f0b66a" style="animation-duration:3.8s;animation-delay:0s">✦</text><text class="pt" x="64" y="110" font-size="8" fill="#f0b66a" style="animation-duration:4.3s;animation-delay:1.1s">✦</text><text class="pt" x="92" y="124" font-size="10" fill="#f0b66a" style="animation-duration:4.7s;animation-delay:2.1s">✦</text><text class="pt" x="54" y="132" font-size="14" fill="#f0b66a" style="animation-duration:5.2s;animation-delay:0.55s">·</text><text class="pt" x="110" y="114" font-size="9" fill="#f0b66a" style="animation-duration:5.6s;animation-delay:3.0s">✧</text><text class="pt" x="76" y="108" font-size="12" fill="#f0b66a" style="animation-duration:6.0s;animation-delay:1.7s">·</text><text class="pt" x="46" y="98" font-size="7" fill="#f0b66a" style="animation-duration:6.5s;animation-delay:3.8s">✦</text>

  <!-- Sprite: single element, transform pivots from feet -->
  <image class="mon" href="data:image/png;base64," x="30" y="52" width="92" height="92" preserveAspectRatio="xMidYMax meet"/>

  <!-- Speech bubble -->
  <g class="bub">
    <rect x="118" y="16" rx="10" width="145" height="28"
          fill="#160f24" fill-opacity="0.94" stroke="#f0b66a" stroke-opacity="0.45" stroke-width="1"/>
    <rect x="122" y="18" rx="6"  width="137" height="6"
          fill="white" fill-opacity="0.04"/>
    <path d="M128 44 l-10 11 l14 -5 z" fill="#160f24" fill-opacity="0.94"/>
    <text x="132" y="35" font-size="12" fill="#e9e2fb">quietly building</text>
  </g>

  <!-- Hearthmon label -->
  <text class="label" x="168" y="62" font-size="14" font-weight="700" fill="#f0b66a">✦ Hearthmon</text>

  <!-- Companion name with shimmer -->
  <text x="168" y="86" font-size="20" font-weight="800" fill="url(#nameShimmer)">Coder-mon</text>

  <!-- Chips -->
  <g class="chip" style="animation-delay:0s"><rect x="168" y="98" rx="9" width="72" height="20" fill="#f0b66a" fill-opacity="0.12" stroke="#f0b66a" stroke-opacity="0.5"/><rect x="168" y="98" rx="9" width="72" height="20" fill="url(#chipGlint)" fill-opacity="0" class="chipshine"/><text x="204" y="112" font-size="11" fill="#f0b66a" text-anchor="middle">Stranger</text></g><g class="chip" style="animation-delay:0.6s"><rect x="248" y="98" rx="9" width="135" height="20" fill="#f0b66a" fill-opacity="0.12" stroke="#f0b66a" stroke-opacity="0.5"/><rect x="248" y="98" rx="9" width="135" height="20" fill="url(#chipGlint)" fill-opacity="0" class="chipshine"/><text x="316" y="112" font-size="11" fill="#f0b66a" text-anchor="middle">👺 Chaotic Goblin</text></g>

  <!-- Tagline -->
  <text x="168" y="142" font-size="12" fill="#c9bff0">✦ building, quietly</text>

  <!-- Footer -->
  <text class="footer" x="462" y="160" font-size="10" fill="#8d82ab" text-anchor="end">40 commits · 1 day together</text>

  <style>text{font-family:system-ui,'Segoe UI',sans-serif}</style>
</svg>