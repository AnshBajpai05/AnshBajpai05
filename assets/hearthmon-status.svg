<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="172" viewBox="0 0 480 172" role="img" aria-label="Hearthmon — Coder-mon, quietly building">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1830"/><stop offset="1" stop-color="#2b2342"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%"><stop offset="0" stop-color="#f0b66a" stop-opacity="0.55"/><stop offset="1" stop-color="#f0b66a" stop-opacity="0"/></radialGradient>
    <style>
      .mon { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.8s ease-in-out infinite; image-rendering: pixelated; }
      .glow { animation: pulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pt { opacity: 0; animation: rise 4.4s ease-in-out infinite; }
      .bub { animation: pulse 4.5s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2.5px) scale(1.035); } }
      @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 0.85; } }
      @keyframes rise { 0% { opacity: 0; transform: translateY(0); } 18% { opacity: 0.9; } 100% { opacity: 0; transform: translateY(-30px); } }
    </style>
  </defs>

  <rect width="480" height="172" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="479" height="171" rx="16" fill="none" stroke="#786ca0" stroke-opacity="0.35"/>

  <ellipse class="glow" cx="76" cy="100" rx="52" ry="48" fill="url(#glow)"/>
  <ellipse cx="76" cy="146" rx="40" ry="7" fill="#000" fill-opacity="0.3"/>
  <text class="pt" x="40" y="120" font-size="11" fill="#f0b66a" style="animation-delay:0s">✦</text><text class="pt" x="96" y="120" font-size="11" fill="#f0b66a" style="animation-delay:1.3s">✦</text><text class="pt" x="70" y="120" font-size="11" fill="#f0b66a" style="animation-delay:2.6s">✦</text><text class="pt" x="118" y="120" font-size="11" fill="#f0b66a" style="animation-delay:3.4s">·</text>
  <image class="mon" href="data:image/png;base64," x="30" y="52" width="92" height="92" preserveAspectRatio="xMidYMax meet"/>

  <!-- speech bubble -->
  <g class="bub">
    <rect x="118" y="18" rx="9" width="139" height="26" fill="#160f24" fill-opacity="0.92" stroke="#786ca0" stroke-opacity="0.5"/>
    <path d="M126 44 l-12 12 l16 -6 z" fill="#160f24" fill-opacity="0.92"/>
    <text x="130" y="35" font-size="12" fill="#e9e2fb">quietly building</text>
  </g>

  <text x="168" y="62" font-size="15" font-weight="700" fill="#f0b66a">🌙 Hearthmon</text>
  <text x="168" y="86" font-size="20" font-weight="800" fill="#f6f1ff">Coder-mon</text>
  <g><rect x="168" y="98" rx="9" width="72" height="20" fill="#f0b66a" fill-opacity="0.14" stroke="#f0b66a" stroke-opacity="0.4"/><text x="204" y="112" font-size="11" fill="#f0d9a6" text-anchor="middle">Stranger</text></g><g><rect x="248" y="98" rx="9" width="100" height="20" fill="#f0b66a" fill-opacity="0.14" stroke="#f0b66a" stroke-opacity="0.4"/><text x="298" y="112" font-size="11" fill="#f0d9a6" text-anchor="middle">🦉 Night Owl</text></g>
  <text x="168" y="142" font-size="12" fill="#c9bff0">✦ building, quietly</text>
  <text x="460" y="158" font-size="11" fill="#8d82ab" text-anchor="end">27 commits · 0 days together</text>

  <style>text{font-family:system-ui,'Segoe UI',sans-serif}</style>
</svg>