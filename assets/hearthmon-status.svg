<svg xmlns="http://www.w3.org/2000/svg" width="480" height="150" viewBox="0 0 480 150" role="img" aria-label="Hearthmon status card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1830"/>
      <stop offset="1" stop-color="#2b2342"/>
    </linearGradient>
  </defs>
  <rect width="480" height="150" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="479" height="149" rx="16" fill="none" stroke="#786ca0" stroke-opacity="0.35"/>
  <text x="22" y="34" font-size="15" font-weight="700" fill="#f0b66a" font-family="system-ui,Segoe UI,sans-serif">🌙 Hearthmon</text>
  <text x="22" y="62" font-size="20" font-weight="800" fill="#f6f1ff" font-family="system-ui,Segoe UI,sans-serif">Lucario <tspan font-size="13" font-weight="400" fill="#9d92bd">your coding companion</tspan></text>
  <g>
    <rect x="22" y="74" rx="9" ry="9" width="120" height="20" fill="#f0b66a" fill-opacity="0.14" stroke="#f0b66a" stroke-opacity="0.4"/>
    <text x="82" y="88" font-size="11" fill="#f0d9a6" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">Trusted Friend</text>
  </g>
  <text x="22" y="120" font-size="13" fill="#c9bff0" font-family="system-ui,Segoe UI,sans-serif">✦ quietly building…</text>
  <text x="458" y="120" font-size="11" fill="#8d82ab" text-anchor="end" font-family="system-ui,Segoe UI,sans-serif">auto-updates when Hearthmon runs</text>
</svg>
